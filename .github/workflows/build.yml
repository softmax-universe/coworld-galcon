name: Github Actions
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 5
    env:
      GALCON_DEPS: ${{ github.workspace }}/..
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: treeform/setup-nim-action@v6
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby create
          nimby sync "${{ github.event.repository.name }}/galcon.lock"
      - name: Check unit tests
        run: nim check -d:headless -d:release -d:fixedChecks -d:nimTypeNames tests/unit_tests.nim
      - name: Run unit tests
        run: nim r -d:headless -d:release -d:fixedChecks -d:nimTypeNames tests/unit_tests.nim
